# Repo-specific overlay. Deep-merged over the canonical rsconstruct.toml.

# README.md renders from tera.templates/README.md.tera, loading config/*.lua
# with load_lua (the pyanyzip pattern). The pydmt mako templates are gone.
[processor.tera]
src_dirs = ["tera.templates"]

# The Makefile's active check was perlcritic on each src/**/*.pl (DO_CRITIC:=1;
# DO_LINT and DO_COMPILE were off). rsconstruct's perlcritic processor does
# exactly that; point it at src.
[processor.perlcritic]
src_dirs = ["src"]
src_extensions = [".pl"]

# perlcritic (Perl::Critic) checks the demos.
[dependencies]
system = [
    "libperl-critic-perl",
]
