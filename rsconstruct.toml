# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]
src_dirs = ["tera.templates"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["src"]

[processor.zspell]
src_dirs = ["src"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src", "scripts", "config"]

[processor.pylint]
src_dirs = ["src", "scripts", "config"]

[processor.mypy]
src_dirs = ["src", "scripts", "config"]

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts", "src", "config"]
args = ["--severity=error", "--shell=bash"]

# ─── lua ─────────────────────────────────────────────────────────────────────

[processor.luacheck]
src_dirs = ["config"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# The Makefile's active check was perlcritic on each src/**/*.pl (DO_CRITIC:=1;
# DO_LINT and DO_COMPILE were off). rsconstruct's perlcritic processor does
# exactly that; point it at src.
[processor.perlcritic]
src_dirs = ["src"]
src_extensions = [".pl"]

# perlcritic (Perl::Critic) checks the demos.
[dependencies]
system = [
    "libperl-critic-perl",
]

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
